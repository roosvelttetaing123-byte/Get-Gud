    <script>
      // Standalone iOS can report a short 100dvh on a cold start; size the shell from
      // innerHeight instead and keep it in sync.
      (function () {
        var root = document.documentElement;
        function set() {
          root.style.setProperty('--app-height', window.innerHeight + 'px');
        }
        set();
        window.addEventListener('resize', set);
        window.addEventListener('orientationchange', set);
        window.addEventListener('pageshow', set);
        window.addEventListener('load', function () {
          set();
          setTimeout(set, 250);
        });
      })();
    </script>
    <style id="expo-reset">
      :root {
        color-scheme: dark;
        background-color: #000;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #000;
        color: #fff;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        font-family: -apple-system, system-ui, 'SF Pro Text', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      /* The shell never scrolls; only inner ScrollViews do. */
      #root {
        position: fixed;
        inset: 0;
        height: var(--app-height, 100%);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background-color: #000;
      }
      /* Native feel: no tap flash, no double-tap zoom (pinch zoom still works), no
         long-press callout or text selection outside editable fields. */
      * {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      input,
      textarea,
      [contenteditable],
      [contenteditable] * {
        -webkit-touch-callout: default;
        -webkit-user-select: text;
        user-select: text;
      }
      img {
        -webkit-user-drag: none;
      }
      /* 16px or more stops iOS zooming into a focused field. */
      input,
      textarea,
      select {
        font-size: 17px;
      }
      /* Focus rings for keyboard users only. */
      :focus:not(:focus-visible) {
        outline: none;
      }
      :focus-visible {
        outline: 2px solid #0a84ff;
        outline-offset: 2px;
      }
      /* Text fields draw their own (gold) focus border. */
      input:focus-visible,
      textarea:focus-visible {
        outline: none;
      }
    </style>
